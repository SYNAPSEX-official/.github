<!doctype html>
<html lang="en">
        <head>
                <meta charset="UTF-8" />
                <meta
                        name="viewport"
                        content="width=device-width, initial-scale=1.0"
                />
                <title>SYNAPSNEX</title>
                <link rel="stylesheet" href="style.css" />

                <link
                        rel="stylesheet"
                        href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"
                />
        </head>
        <body>
                <nav>
                        <div class="logo">
                                <ul class="nav-links">
                                        <li class="active">
                                                <a href="./">Home</a>
                                        </li>
                                        <li><a href="./work/">Work</a></li>
                                        <li><a href="./team/">Team</a></li>
                                        <li>
                                                <a href="./contact/">Contact</a>
                                        </li>
                                </ul>
                        </div>
                </nav>
                <div class="hero">
                        <h1 class="name">SYNAPSNEX</h1>
                        <p>CODE. BREAK. WHILE LOOP.</p>
                </div>
                <div class="moments">
                        <h1>[001] MOMENTS</h1>
                         <div class="swiper moments-stack">

                    <div class="swiper-wrapper">

                        <div class="swiper-slide">
                            <img
                                src="1348663.jpeg"
                                alt="SYNAPSNEX team at an event"
                            >
                        </div>

                        <div class="swiper-slide">
                            <img
                                src="1348663.jpeg"
                                alt="SYNAPSNEX team at a competition"
                            >
                        </div>

                        <div class="swiper-slide">
                            <img
                                src="1348663.jpeg"
                                alt="SYNAPSNEX team meetup"
                            >
                        </div>

                        <div class="swiper-slide">
                            <img
                                src="1348663.jpeg"
                                alt="SYNAPSNEX team at a game jam"
                            >
                        </div>

                </div>
                </div>
                </div>
                <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
                <script>
                    const moments = new Swiper(".moments-stack", {
                    effect: "cards",

                    grabCursor: true,

                    loop: true,

                    cardsEffect: {
                        perSlideOffset: 8,
                        perSlideRotate: 2,
                        slideShadows: false,
                    },
                });
                </script>
        </body>
</html>
